<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Magic Bar</title>
    <link rel="stylesheet" href="companion.css" />
  </head>
  <body>
    <section id="bar" class="chat-bar">
      <div class="drag-handle" aria-hidden="true"></div>
      <button id="close" class="close-button" type="button" data-i18n-aria="close" aria-label="Close">×</button>

      <div id="items" class="context-strip" aria-live="polite"></div>

      <label class="composer" for="prompt">
        <textarea
          id="prompt"
          rows="1"
          maxlength="12000"
          data-i18n-placeholder="requestPlaceholder"
          placeholder="Message ChatGPT"
        ></textarea>
      </label>

      <div class="toolbar">
        <div class="toolbar-left">
          <button id="toggle-tools" class="round-button" type="button" data-i18n-aria="addContext" aria-label="Add context">＋</button>
          <label class="audit-toggle" for="audit-security">
            <input id="audit-security" type="checkbox" />
            <span data-i18n="securityAudit">Security review</span>
          </label>
          <label class="audit-toggle" for="audit-quality">
            <input id="audit-quality" type="checkbox" />
            <span data-i18n="qualityAudit">Quality review</span>
          </label>
          <label class="audit-toggle project-toggle" for="project-enabled">
            <input id="project-enabled" type="checkbox" />
            <span data-i18n="projectLabel">Project</span>
          </label>
          <div id="project-picker" class="project-picker" hidden>
            <select id="project-select" aria-label="ChatGPT project"></select>
            <input id="new-project-name" type="text" maxlength="120" autocomplete="off" data-i18n-placeholder="newProjectPlaceholder" placeholder="Nom du nouveau projet" hidden />
          </div>
          <span id="source-indicator" class="source-indicator" hidden></span>
        </div>

        <div class="toolbar-right">
          <div class="chat-mode" role="group" data-i18n-aria="chatDestination" aria-label="Conversation cible">
            <button id="new-chat" class="mode-button selected" type="button" data-mode="new" data-i18n="newChat">New</button>
            <button id="resume-chat" class="mode-button" type="button" data-mode="resume" data-i18n="resumeChat">Last</button>
          </div>
          <button id="prepare" class="send-button" type="button" data-i18n-aria="prepare" aria-label="Prepare in ChatGPT">↑</button>
        </div>
      </div>

      <p id="status" role="status"></p>
    </section>
    <script src="companion.js"></script>
  </body>
</html>
