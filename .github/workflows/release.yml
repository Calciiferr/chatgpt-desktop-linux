name: Publish Debian release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag matches package version
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("Tag and package version differ")'
      - run: npm ci
      - run: npm test
      - run: npm run dist:deb -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          package="ChatGPT-Desktop-Linux-${version}-amd64.deb"
          cd release
          sha256sum "$package" > SHA256SUMS.txt
          args=()
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$package" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ChatGPT Desktop Linux $version" --generate-notes "${args[@]}"
