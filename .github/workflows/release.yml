name: Publish Debian release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag matches package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag and package version differ")'
      - run: npm ci
      - run: npm test
      - run: npm run dist:deb
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          package="ChatGPT-Desktop-Linux-${version}-amd64.deb"
          cd release
          sha256sum "$package" > SHA256SUMS.txt
          args=()
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$package" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ChatGPT Desktop Linux $version" --generate-notes "${args[@]}"
